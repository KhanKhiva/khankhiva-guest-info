<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Khan Khiva Hotel | Guest Information</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="hero">
<div class="overlay">
<img src="IMG_3817.PNG" class="logo">
<h1>KHAN KHIVA HOTEL</h1>
<p class="subtitle" data-en="Guest Information" data-ru="Информация для гостей" data-uz="Mehmonlar uchun ma'lumot">Guest Information</p>
<div class="language-switcher">
<button onclick="setLanguage('en')" class="active" id="btn-en">English</button>
<button onclick="setLanguage('ru')" id="btn-ru">Русский</button>
<button onclick="setLanguage('uz')" id="btn-uz">O'zbekcha</button>
</div>
</div>
</header>

<div class="container">
<div class="section">
<h2 data-en="Welcome" data-ru="Добро пожаловать" data-uz="Xush kelibsiz">Welcome</h2>
<div class="info-card" data-en="Welcome to Khan Khiva Hotel." data-ru="Добро пожаловать в отель Khan Khiva." data-uz="Khan Khiva mehmonxonasiga xush kelibsiz.">Welcome to Khan Khiva Hotel.</div>
</div>

<div class="section">
<h2 data-en="Internet Access" data-ru="Доступ в Интернет" data-uz="Internetga kirish">Internet Access</h2>
<div class="info-card"
data-en="Free wireless internet is available in your room and in our public areas."
data-ru="Беспроводной доступ в Интернет предоставляется бесплатно в Вашем номере и в общественных местах."
data-uz="Xonangizda va umumiy hududlarda bepul simsiz internet mavjud.">
Free wireless internet is available in your room and in our public areas.
</div>
</div>

<div class="section">
<h2 data-en="Medical Help" data-ru="Медицинская помощь" data-uz="Tibbiy yordam">Medical Help</h2>
<div class="info-card"
data-en='Please press the "100" button on your phone to call for medical assistance.'
data-ru='Нажмите кнопку "100" на телефоне для вызова медицинской помощи.'
data-uz='Tibbiy yordam chaqirish uchun telefondagi "100" tugmasini bosing.'>
Please press the "100" button on your phone to call for medical assistance.
</div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
